career-profile:
  title: Professional Profile
  summary: |
    Experimental physicist specialising in **distributed sensor systems, RF signal processing, precision timing, calibration, interferometry, and uncertainty-aware scientific computing**. I build reproducible Python and C++ workflows that turn complex measurements into reliable physical insight.

    My doctoral research within the international Pierre Auger Collaboration advanced radio-interferometric reconstruction of very inclined cosmic-ray air showers through timing validation, antenna-response studies, simulation, statistics, and array-wide quality control.

    I am open to research and industry collaborations where sensing, scientific computing, AI, and rigorous quantitative reasoning meet.

education:
  title: Education
  info:
    - degree: Doctoral Research in High-Energy Physics
      university: Radboud University, Netherlands
      time: 2021 – 2026
      details: |
        Thesis: *In Phase With the Cosmos: Mass Composition of Cosmic Rays via Radio Interferometry*. Doctoral thesis completed and approved for defence in 2026. Research conducted within the Pierre Auger Collaboration and the Nikhef research programme.
    - degree: MSc, Nuclear Physics and Technology
      university: National Research Nuclear University MEPhI, Russia
      time: 2018 – 2021
      details: |
        Modelled the high-energy cosmic-ray positron excess using PAMELA and AMS-02 observations and the GALPROP propagation framework.
    - degree: BSc, Physics
      university: University of Zambia
      time: 2013 – 2017
      details: |
        Training in mechanics, electromagnetism, quantum mechanics, statistical physics, electronics, solid-state physics, renewable energy, and computational physics.

experiences:
  title: Selected Experience
  info:
    - role: Sensor Development, Calibration and Intelligent Data Processing
      time: 2021 – 2026
      company: Radboud University · Pierre Auger Collaboration
      details: |
        - Developed calibration and reconstruction workflows for a distributed 30–80 MHz radio-detector array.
        - Built phase-based timing methods and independent closure tests supporting sub-nanosecond validation of station-to-station timing.
        - Achieved the first successful interferometric reconstruction of a very inclined air-shower event during the project.
        - Studied antenna response, detector position, atmospheric refractivity, and noise systematics.
        - Produced reproducible Python/C++ pipelines, diagnostic visualisations, and quality-control procedures for large scientific datasets.
        - Contributed to detector operations, collaboration reviews, workshops, and technical documentation.
    - role: Radiation Protection Officer
      time: 2021 – 2022
      company: Radiation Protection Authority of Zambia
      details: |
        - Supported radiation-safety assessment, regulatory compliance, instrumentation checks, and technical reporting.
        - Applied measurement, calibration, uncertainty, and safety principles in an operational environment.
    - role: Research Intern
      time: 2017
      company: National Institute for Scientific and Industrial Research, Zambia
      details: |
        - Performed radiation detection, alpha/gamma spectroscopy, X-ray fluorescence measurements, sample preparation, and laboratory calibration.
        - Interpreted spectra and documented results for applied nuclear and materials-analysis work.

projects:
  title: Research & Technical Highlights
  intro: Selected projects connecting precision measurement, computation, and real-world systems.
  assignments:
    - title: Radio Interferometry for Cosmic-Ray Detection
      tagline: Coherent reconstruction of inclined air showers using synchronised measurements from widely separated antennas.
      category: sensing
    - title: Precision Timing and Phase Calibration
      tagline: Beacon- and broadcast-carrier methods, discrete phase solutions, and closure diagnostics for distributed detector stations.
      category: sensing
    - title: Antenna Response and Array-Systematics Studies
      tagline: Quantified how antenna models, geometry, refractivity, noise, and calibration choices affect reconstructed signals.
      category: modelling
    - title: Cosmic-Ray Propagation Modelling
      tagline: Investigated the positron excess using PAMELA/AMS-02 observations and GALPROP simulations.
      category: modelling
    - title: Water-Level Monitoring for Energy Security
      tagline: Awarded a £5,000 grant for satellite-imaging and geodesy methods supporting water-level tracking in Zambia.
      category: impact
    - title: AI-Assisted RFI Classification
      tagline: Concept development for probabilistic interference classification and RFI-aware calibration in MeerKAT/SKA-relevant radio data.
      category: ai

