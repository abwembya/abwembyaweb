name: Build and security checks
on:
  pull_request:
  push:
    branches: [master, 'security/**']
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec bundler-audit check --update
      - run: bundle exec jekyll build --safe --strict_front_matter
        env:
          JEKYLL_ENV: production
      - run: python3 scripts/check-site-security.py
      - run: |
          node --check assets/js/theme-init.js
          node --check assets/js/interactive.js
          node --check assets/js/analytics.js
