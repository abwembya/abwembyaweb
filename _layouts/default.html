---
---
<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header d-print-none">
    <a class="site-brand" href="{{ site.baseurl }}/">AB</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      <i class="fas fa-bars" aria-hidden="true"></i><span class="sr-only">Menu</span>
    </button>
    <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
      <a href="{{ site.baseurl }}/">Home</a>
      <a href="{{ site.baseurl }}/experience/">Experience</a>
      <a href="{{ site.baseurl }}/research/">Research</a>
      <a href="{{ site.baseurl }}/projects/">Projects</a>
      <a href="{{ site.baseurl }}/education/">Education</a>
      <a href="{{ site.baseurl }}/publications/">Publications</a>
      <a class="nav-contact" href="{{ site.baseurl }}/contact/">Contact</a>
    </nav>
    <div class="header-actions">
      <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle dark mode">
        <i class="fas fa-moon" aria-hidden="true"></i>
      </button>
      <button onclick="print()" class="icon-button" type="button" aria-label="Print CV">
        <i class="fas fa-print" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div class="wrapper">
    {% include sidebar.html %}
    <main class="main-wrapper" id="main-content">
      {{ content }}
    </main>
  </div>

  <button id="backToTop" class="back-to-top d-print-none" type="button" aria-label="Back to top">
    <i class="fas fa-arrow-up" aria-hidden="true"></i>
  </button>

  {% include footer.html %}
  {% include scripts.html %}
  <script src="{{ site.baseurl }}/assets/js/interactive.js"></script>
</body>
</html>
