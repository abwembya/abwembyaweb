<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24527a"/>
      <stop offset="100%" stop-color="#101c28"/>
    </linearGradient>
    <linearGradient id="bars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4fb3e0"/>
      <stop offset="100%" stop-color="#a8e6ff"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#bg3)"/>

  <!-- Waveform / spectrum bars along the top, like a signal readout -->
  <g fill="url(#bars)" opacity="0.85">
    <rect x="40" y="42" width="7" height="18" rx="3"/>
    <rect x="52" y="34" width="7" height="26" rx="3"/>
    <rect x="64" y="26" width="7" height="34" rx="3"/>
    <rect x="76" y="38" width="7" height="22" rx="3"/>
    <rect x="88" y="30" width="7" height="30" rx="3"/>
    <rect x="100" y="20" width="7" height="40" rx="3"/>
    <rect x="112" y="32" width="7" height="28" rx="3"/>
    <rect x="124" y="42" width="7" height="18" rx="3"/>
    <rect x="136" y="36" width="7" height="24" rx="3"/>
    <rect x="148" y="46" width="7" height="14" rx="3"/>
    <rect x="160" y="40" width="7" height="20" rx="3"/>
  </g>

  <!-- Monogram -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="66" fill="#f5f9fc" letter-spacing="-2">AB</text>
</svg>
